# Render Blueprint: the FastAPI API + background worker as one free Docker web service.
# Postgres is hosted separately (Neon); paste its connection string as DATABASE_URL.
# With rootDir set, dockerfilePath and dockerContext are relative to backend/.
services:
  - type: web
    runtime: docker
    name: smart-web-scraper-api
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
