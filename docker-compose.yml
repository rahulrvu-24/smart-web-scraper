services:
  postgres:
    image: postgres:16-alpine
    container_name: sws-postgres
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper  
      POSTGRES_DB: smart_web_scraper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d smart_web_scraper"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: